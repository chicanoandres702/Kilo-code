# [Parent Feature/Milestone] Kilo Android App
# [Subtask] GitHub Actions CI/CD workflow for Android
# [Law Check] 45 lines

name: android-build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Download Kilo arm64 binary
        run: |
          KILO_VER=$(curl -s https://api.github.com/repos/Kilo-Org/kilocode/releases/latest | jq -r .tag_name)
          curl -L "https://github.com/Kilo-Org/kilocode/releases/download/${KILO_VER}/kilo-linux-arm64.tar.gz" -o kilo.tar.gz
          tar -xzf kilo.tar.gz
          mkdir -p app/src/main/assets
          cp kilo app/src/main/assets/
          chmod +x app/src/main/assets/kilo

      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build with Gradle
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            gradle assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Prepare Artifact
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_TYPE="release"
            FILE_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
            # Note: Depending on signing setup, might be app-release.apk
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
                FILE_PATH="app/build/outputs/apk/release/app-release.apk"
            fi
            APK_NAME="kilo-${VERSION}-release.apk"
            cp "$FILE_PATH" "$APK_NAME"
          else
            BUILD_TYPE="debug"
            APK_NAME="kilo-${VERSION}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          fi
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
