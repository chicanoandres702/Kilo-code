# [Parent Feature/Milestone] Kilo Android App
# [Subtask] GitHub Actions CI/CD workflow for Android
# [Law Check] 67 lines

name: android-build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build with Gradle
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            gradle lintRelease assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            gradle lintDebug assembleDebug --no-daemon
          fi

      - name: Prepare Artifact
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' packages/app/app/build.gradle.kts)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_TYPE="release"
            APK_PATH="packages/app/app/build/outputs/apk/release/app-release.apk"
            test -f "$APK_PATH" || APK_PATH="packages/app/app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            BUILD_TYPE="debug"
            APK_PATH="packages/app/app/build/outputs/apk/debug/app-debug.apk"
          fi
          mkdir -p dist
          cp "$APK_PATH" "dist/kilo-${VERSION}-${BUILD_TYPE}.apk"
          ARTIFACT_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/:' '__')
          echo "ARTIFACT_PATH=dist" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=kilo-android-${ARTIFACT_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
