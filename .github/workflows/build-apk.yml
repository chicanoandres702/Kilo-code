# [Parent Feature/Milestone] Kilo Android App
# [Subtask] GitHub Actions workflow for APK build with robust binary download
# [Law Check] 55 lines

name: Build APK

on:
  push:
    branches: [ "feature/kilo-android" ]
  pull_request:
    branches: [ "main", "feature/kilo-android" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Download Kilo arm64 binary
        run: |
          mkdir -p src/features/kilo-android/assets
          curl -L "https://github.com/Kilo-Org/kilocode/releases/download/v7.3.41/kilo-linux-arm64.tar.gz" -o kilo.tar.gz
          tar -xzf kilo.tar.gz -C /tmp
          # List files for debugging
          ls -R /tmp/kilo*
          # Find the binary
          KILO_BIN=$(find /tmp -name "kilo" -type f | head -1)
          if [ -z "$KILO_BIN" ]; then
            echo "Error: Kilo binary not found"
            exit 1
          fi
          echo "Found binary at: $KILO_BIN"
          cp "$KILO_BIN" src/features/kilo-android/assets/kilo
          chmod +x src/features/kilo-android/assets/kilo
      
      - name: Build APK
        working-directory: ./src/features/kilo-android
        run: |
          # Install Gradle directly
          sudo apt-get install -y gradle
          gradle :app:assembleDebug --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kilo-android-apk
          path: src/features/kilo-android/app/build/outputs/apk/debug/app-debug.apk